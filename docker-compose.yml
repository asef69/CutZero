services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cutzero
      POSTGRES_PASSWORD: cutzero
      POSTGRES_DB: cutzero
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cutzero"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Local development credentials only; set your own for any shared deployment.
      DATABASE_URL: postgresql://cutzero:cutzero@db:5432/cutzero
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
