name: CI

on:
  push:
  pull_request:

jobs:
  engine-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --python 3.12
      - name: Build the C++20 engine (system g++ + CMake)
        run: uv run --project backend python scripts/build_cpp.py
      - name: Engine self-tests and benchmark gate
        run: ./cpp_engine/build/test_bench --dir cpp_engine/testdata --require-gain 10
      - name: API tests
        working-directory: backend
        run: uv run pytest -q
      - name: Benchmark table
        run: uv run --project backend python scripts/benchmark.py

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm run build
